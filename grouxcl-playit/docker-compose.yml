version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: host.docker.internal
      APP_PORT: 8008
    extra_hosts:
      - "host.docker.internal:host-gateway"

  playit:
    image: wisdomsky/playit-docker-web:1.0.10
    restart: on-failure
    network_mode: host
    environment:
      WEBUI_PORT: "8008"
    volumes:
      - ${APP_DATA_DIR}/config:/config
