version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grouxcl-umbrel-auto-mcs_auto-mcs_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  auto-mcs:
    image: macarooniman/auto-mcs:2.3.3@sha256:f33062e114fffda0e6ebdf4ad22e222844af4418334617a8fbc8faa0d7284974

    command: [
      "auto-mcs-ttyd",
      "-W",
      "-t", "disableLeaveAlert=true",
      "-t", "titleFixed=auto-mcs",
      "-t", "fontSize=20",
      "-t", "theme={\"background\": \"#1A1A1A\"}",
      "-p", "8080",
      "-c", "root:auto-mcs",
      "tmux", "-u", "-2", "new", "-A",
      "-s", "auto-mcs",
      "-c", ".",
      "./auto-mcs"
    ]

    stdin_open: true
    tty: true
    restart: on-failure

    volumes:
      - ${APP_DATA_DIR}/data:/root/.auto-mcs

    ports:
      - "7001:7001"
      - "25601:25565"

    extra_hosts:
      - "host.docker.internal:host-gateway"
