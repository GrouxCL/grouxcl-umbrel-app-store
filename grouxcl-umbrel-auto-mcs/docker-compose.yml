version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grouxcl-umbrel-auto-mcs_auto-mcs_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  auto-mcs:
    image: macarooniman/auto-mcs:2.4@sha256:d9f44be5218bc1af6046c1106bbf032c992fbdaa3f2e9fb8024aba6694a81ef9
    command: [
      "auto-mcs-ttyd",
      "-W",
      "-t", "disableLeaveAlert=true",
      "-t", "titleFixed=auto-mcs",
      "-t", "fontSize=20",
      "-t", "theme={\"background\": \"#1A1A1A\"}",
      "-p", "8080",
      "-c", "admin:auto-mcs",
      "tmux", "-u", "-2", "new", "-A",
      "-s", "auto-mcs",
      "-c", ".",
      "./auto-mcs"
    ]
    stdin_open: true
    tty: true
    restart: on-failure
  
    volumes:
      - ${APP_DATA_DIR}/data:/root/.auto-mcs
  
    ports:
      - "7001:7001"
      - "25601:25565"

    extra_hosts:
      - "host.docker.internal:host-gateway"
